server:
  port: 8000

spring:
  application:
    name: agent-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  upload-dir: uploads

llm:
  default-provider: ${LLM_DEFAULT_PROVIDER:qwen}

qwen:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${QWEN_MODEL:qwen-plus}
  embedding-model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
  system-prompt: ${QWEN_SYSTEM_PROMPT:你是一个专业、可靠的中文 AI 助手。}
