server:
  port: 8000

spring:
  application:
    name: agent-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  upload-dir: uploads

llm:
  default-provider: ${LLM_DEFAULT_PROVIDER:qwen}

qwen:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${QWEN_MODEL:qwen-plus}
  embedding-model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
  rerank-enabled: ${QWEN_RERANK_ENABLED:true}
  rerank-url: ${QWEN_RERANK_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/reranks}
  rerank-model: ${QWEN_RERANK_MODEL:qwen3-rerank}
  rerank-instruct: ${QWEN_RERANK_INSTRUCT:Given a web search query, retrieve relevant passages that answer the query.}
  system-prompt: ${QWEN_SYSTEM_PROMPT:你是一个专业、可靠的中文 AI 助手。}

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
  api-key: ${ELASTICSEARCH_API_KEY:}
  vector-index: ${ELASTICSEARCH_VECTOR_INDEX:agent-session-document-chunks}
  num-candidates: ${ELASTICSEARCH_NUM_CANDIDATES:100}

keyword:
  english-tokenizer-path: ${HF_TOKENIZER_PATH:C:/Users/Administrator/.cache/huggingface/hub/models--distilbert-base-uncased/snapshots/12040accade4e8a0f71eabdb258fecc2e7e948be/tokenizer.json}

mcp:
  enabled: ${MCP_ENABLED:false}
  servers: {}
